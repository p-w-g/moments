name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholders only: the Sanity client requires a non-empty
      # projectId/dataset to construct, and $env/static/public needs these
      # to exist to generate its typed exports for svelte-check, but the
      # build doesn't prerender or call the API, so real credentials aren't needed.
      PUBLIC_SANITY_PROJECT_ID: ci-placeholder
      PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      # Real, non-secret values (PUBLIC_-prefixed vars ship to the client
      # bundle anyway) — this job hits the actual Sanity dataset so a
      # schema or query change in studio that breaks moments fails here,
      # not in production.
      PUBLIC_SANITY_PROJECT_ID: yq5vsg1t
      PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
